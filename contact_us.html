<html lang="en">
<head>
  <meta charset="UTF-8">
    <title>Contact us - Travel Recommendation</title>
  <link rel="stylesheet" href="./travel_recommendation.css">
  <style>
    #contactForm {
      max-width: 400px;
      margin: 0 auto;
      background-color: rgba(150, 150, 100, 0.4);
      padding: 1em;
      color: white;
    }
    #contactForm input,
    #contactForm textarea {
      width: 100%;
      margin-bottom: 15px;
      padding: 8px;
    }
    #contactForm button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    #contactForm button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
    <nav><h1>Contact us</h1>
    <ul>
      <li><a href="./index.html" id="home">Home </a></li>
      <li><a href="./about_us.html" id="about">About Us </a></li>
      <li><a href="./contact_us.html" id="contact">Contact Us </a></li>
    </ul>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Contact us</h1>
        </div>
        <div class="content-form">
            <form id="contactForm">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required>Enter your message</textarea>
            <button type="submit" onclick="thankyou()">Submit</button>
            </form>
        </div>
    </div>
    <script>
    function thankyou(){
        alert('Thank you for contacting us!')
    }
  </script>
</body>
</html>
